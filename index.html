<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Secretary</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        input, select, button {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"] {
            flex: 1;
        }
        button.primary {
            background-color: #238636;
            border-color: #238636;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button.primary:hover {
            background-color: #2ea043;
        }
        
        .days-box {
            display: none;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .days-box label {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .task-meta {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }
        button.delete-btn {
            background-color: transparent;
            border-color: #da3633;
            color: #f85149;
            cursor: pointer;
            padding: 6px 10px;
        }
        button.delete-btn:hover {
            background-color: #da3633;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>&gt;_ AI Secretary</h1>

    <div class="card">
        <form id="task-form">
            <div class="row">
                <input type="text" id="title" placeholder="Что нужно напомнить?" required>
                <input type="time" id="remind_time" required>
            </div>

            <div class="row">
                <select id="task_type">
                    <option value="once">Один раз (once)</option>
                    <option value="daily">Каждый день (daily)</option>
                    <option value="weekly">По дням недели (weekly)</option>
                </select>

                <select id="priority">
                    <option value="1">Приоритет: 1 (низкий)</option>
                    <option value="2">Приоритет: 2</option>
                    <option value="3" selected>Приоритет: 3 (обычный)</option>
                    <option value="4">Приоритет: 4</option>
                    <option value="5">Приоритет: 5 (критичный)</option>
                </select>
            </div>

            <div class="days-box" id="days-box">
                <label><input type="checkbox" value="0"> Пн</label>
                <label><input type="checkbox" value="1"> Вт</label>
                <label><input type="checkbox" value="2"> Ср</label>
                <label><input type="checkbox" value="3"> Чт</label>
                <label><input type="checkbox" value="4"> Пт</label>
                <label><input type="checkbox" value="5"> Сб</label>
                <label><input type="checkbox" value="6"> Вс</label>
            </div>

            <button type="submit" class="primary">Добавить задачу</button>
        </form>
    </div>

    <div id="tasks-list"></div>

    <script>
        const form = document.getElementById("task-form");
        const taskTypeSelect = document.getElementById("task_type");
        const daysBox = document.getElementById("days-box");
        const tasksList = document.getElementById("tasks-list");

        taskTypeSelect.addEventListener("change", () => {
            daysBox.style.display = taskTypeSelect.value === "weekly" ? "flex" : "none";
        });

        async function loadTasks() {
            const response = await fetch("/tasks");
            const tasks = await response.json();

            tasksList.innerHTML = "";
            if (tasks.length === 0) {
                tasksList.innerHTML = '<div style="color: #8b949e; text-align: center;">Активных задач пока нет</div>';
                return;
            }

            tasks.forEach(task => {
                const item = document.createElement("div");
                item.className = "task-item";

                const daysInfo = task.task_type === "weekly" ? ` | Дни: [${task.days_of_week}]` : "";
                const statusInfo = task.is_sent ? " · Отправлено" : "";

                item.innerHTML = `
                    <div>
                        <strong>${task.title}</strong>
                        <div class="task-meta">
                            Время: ${task.remind_time} | Тип: ${task.task_type}${daysInfo} | Приоритет: ${task.priority}${statusInfo}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="removeTask(${task.id})">Удалить</button>
                `;
                tasksList.appendChild(item);
            });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const checkedDays = Array.from(daysBox.querySelectorAll("input:checked"))
                .map(cb => cb.value)
                .join(",");

            const payload = {
                title: document.getElementById("title").value,
                remind_time: document.getElementById("remind_time").value,
                task_type: taskTypeSelect.value,
                days_of_week: taskTypeSelect.value === "weekly" ? checkedDays : "",
                priority: Number(document.getElementById("priority").value)
            };

            await fetch("/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            form.reset();
            daysBox.style.display = "none";
            loadTasks(); 
        });

        async function removeTask(id) {
            await fetch(`/tasks/${id}`, { method: "DELETE" });
            loadTasks();
        }

        loadTasks();
    </script>
</body>
</html>
